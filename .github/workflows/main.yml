name: Generate AI Video

on:
  push:
    paths:
      - 'KGU_json.json'

jobs:
  build-video:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install FFmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Render Video from JSON
        run: python render.py

      - name: Commit and Push output.mp4 back to repo
        run: |
          git config --global user.name "VideoBot"
          git config --global user.email "bot@video-generator.local"
          git add output.mp4
          git commit -m "Auto-generated new video from JSON" || echo "No changes to commit"
          git push
